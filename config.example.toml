app = { name = "ElecPostal" }

[http]
port = "8080"

[grpc]
port = "9090"
useTLS = false
certFile = ""
keyFile = ""

[database]
dsn = "host=postgres port=5432 user=dyson password=dyson dbname=elec_postal sslmode=disable"

[redis]
addr = ""
db = 0

[nats]
# Set target in production to enable durable, horizontally scalable SMTP ingestion.
target = "nats://127.0.0.1:4222"
stream = "ELECPOSTAL_INBOUND"
subject = "elecpostal.smtp.inbound"
consumer = "elecpostal-smtp-workers"
workers = 8

[auth]
target = "stargate:9090" # Stargate gRPC target (DyAuthService for request auth, DyAccountService for notification localization); leave empty to disable auth
useTLS = true            # Stargate serves the fleet self-signed cert
tlsSkipVerify = true

[filesystem]
target = ""              # FileSystem gRPC target (host:port); leave empty to disable direct attachment uploads
useTLS = false
tlsSkipVerify = false

[workspace]
target = ""              # Workspace gRPC target; required for workspace mailbox creation and email quota enforcement
useTLS = false
tlsSkipVerify = false

[mail.sendLimits.free]
mailboxDaily = 100
mailboxMonthly = 2000
workspaceDaily = 100
workspaceMonthly = 2000

[mail.sendLimits.pro]
mailboxDaily = 1000
mailboxMonthly = 20000
workspaceDaily = 3000
workspaceMonthly = 60000

[mail.sendLimits.enterprise]
mailboxDaily = 5000
mailboxMonthly = 100000
workspaceDaily = 25000
workspaceMonthly = 500000

[mail.relay]
adapter = ""                # direct-smtp sends to MX directly; ses uses the AWS SDK
host = "mail.example.com"   # required only by direct-smtp for HELO/EHLO
port = "587"
username = ""               # reserved for SMTP-based adapters
password = ""               # reserved for SMTP-based adapters
region = "ap-northeast-1"   # required by adapter = "ses"; AWS SDK credentials use its default provider chain
inboundHost = "mail.example.com" # matching recipient MX records are delivered locally before the outbound adapter
dnsResolver = "1.1.1.1"     # DNS server used to validate custom-domain DKIM, SPF, and inbound MX records
tlsMode = "starttls"       # direct-smtp: starttls or required; listener modes: starttls, implicit, disabled
tlsHost = ""               # optional TLS server-name override
tlsSkipVerify = false

[mail.spam]
# Inbound spam filter: SPF/DKIM/DMARC sender authentication, weighted content
# and spoofing rules, and an optional global Bayes classifier. Mail whose
# accumulated score reaches the threshold is filed into the Spam folder and
# (when addXSpamHeader is set) carries X-Spam-Status/X-Spam-Score headers in
# its stored source. Mail is never rejected at SMTP.
enabled = true
threshold = 5.0            # score at or above which a message is routed to Spam. A single auth failure (<= 1.5) is never enough on its own
addXSpamHeader = true      # write X-Spam-Status/X-Spam-Score into the stored protocol source

[mail.spam.bayes]
# One global model for the whole deployment (stored in Redis under
# "elecpostal:spam:bayes"). User spam/not-spam moves train and untrain it.
# Bayes contributes nothing until both classes reach minLearns messages.
enabled = true
minLearns = 100            # per-class minimum trained messages before Bayes scores mail
minTokens = 11             # minimum recognised tokens before a Bayes verdict is trusted

[[mail.smtp]]
enabled = true
host = ""
port = "25"                # public inbound MX listener; accepts local recipients only
tlsMode = "starttls"
certFile = ""
keyFile = ""
maxMessageBytes = 26214400
maxRecipients = 100

[[mail.smtp]]
enabled = true
host = ""
port = "587"               # authenticated client submission
tlsMode = "starttls"
certFile = ""
keyFile = ""
maxMessageBytes = 26214400
maxRecipients = 100
requireAuth = true

[[mail.smtp]]
enabled = true
host = ""
port = "465"               # authenticated implicit-TLS SMTP submission
tlsMode = "implicit"
certFile = ""
keyFile = ""
maxMessageBytes = 26214400
maxRecipients = 100
requireAuth = true

[[mail.imap]]
enabled = true
host = ""
port = "143"               # use 993 for implicit TLS
tlsMode = "starttls"
certFile = ""
keyFile = ""

[[mail.pop3]]
enabled = true
host = ""
port = "110"               # use 995 for implicit TLS
tlsMode = "starttls"
certFile = ""
keyFile = ""

[ring]
target = ""              # Ring gRPC target (host:port); leave empty to disable notifications. Pushes target the dev.solsynth.solarwatt app (auth.target resolves the recipient language)
useTLS = false
tlsSkipVerify = false

[websocket]
# DysonNetwork WebSocket gateway gRPC endpoint for mail.* realtime packets.
target = ""
useTLS = false
tlsSkipVerify = false

[personality]
# Persona gRPC target used to summarize ordinary mail for notifications.
# Summaries are opt-in per account (see PATCH /api/settings/notifications) and
# are only requested for messages our own rules found no verification code,
# security event, or action request in, so credentials never reach the agent.
#
# Summaries are generated as mail is delivered, not only when Ring is
# configured: they are stored on the message and used as its list preview
# (GET /api/emails, JMAP preview) as well as the notification subtitle.
#
# Each summary is a normal Personality completion: it is metered against the
# mailbox owner's own Personality usage limits and billing, so the per-account
# quota lives in Persona's [billing] configuration, not here. Leave Persona's
# billing enabled to keep summaries bounded; this service adds no separate cap.
target = ""
useTLS = false
tlsSkipVerify = false
agent = ""             # personality agent that writes the summaries, e.g. "mail-summarizer"
model = ""             # optional model override; empty uses the agent default
timeoutSeconds = 20    # per-summary deadline; a slow agent is skipped

[sentry]
dsn = ""
tracesSampleRate = 0.01
environment = ""
release = ""
