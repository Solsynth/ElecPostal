app = { name = "ElecPostal" }

[http]
port = "8080"

[grpc]
port = "9090"
useTLS = false
certFile = ""
keyFile = ""

[database]
dsn = "host=postgres port=5432 user=dyson password=dyson dbname=elec_postal sslmode=disable"

[redis]
addr = ""

[auth]
target = ""              # Solar auth gRPC target (host:port); leave empty to disable auth
useTLS = false
tlsSkipVerify = false

[filesystem]
target = ""              # FileSystem gRPC target (host:port); leave empty to disable direct attachment uploads
useTLS = false
tlsSkipVerify = false

[mail.relay]
adapter = "ses-smtp"       # empty disables relay; adapters can be added without changing email logic
host = "email-smtp.us-east-1.amazonaws.com"
port = "587"
username = ""              # SES SMTP username; use MAIL_RELAY_USERNAME in production
password = ""              # SES SMTP password; use MAIL_RELAY_PASSWORD in production
tlsMode = "starttls"       # starttls, implicit, disabled
tlsHost = ""               # optional TLS server-name override
tlsSkipVerify = false

[mail.smtp]
enabled = true
host = ""
port = "587"               # submission default; use 25 for relay or 465 for implicit TLS
tlsMode = "starttls"
certFile = ""
keyFile = ""

[mail.imap]
enabled = true
host = ""
port = "143"               # use 993 for implicit TLS
tlsMode = "starttls"
certFile = ""
keyFile = ""

[mail.pop3]
enabled = true
host = ""
port = "110"               # use 995 for implicit TLS
tlsMode = "starttls"
certFile = ""
keyFile = ""

[solarNetwork]
baseUrl = ""             # Solar Network API base URL (e.g. https://api.dyson.example)
accessToken = ""         # Bearer token for Solar Network API calls
accountName = ""         # Bot account name for websocket identification

[sentry]
dsn = ""
tracesSampleRate = 0.01
environment = ""
release = ""
