services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elecpostal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: elecpostal
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elecpostal -d elecpostal"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    volumes: [nats-data:/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  elecpostal:
    build: .
    command: ["--config", "/run/config/config.toml"]
    volumes: [./config.toml:/run/config/config.toml:ro, ./certs:/run/certs:ro]
    ports:
      - "8080:8080"
      - "9090:9090"
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
  redis-data:
